<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
    :root {
        --accent: #1abc9c;
        --accent-dark: #16a085;
        --panel: #2c3e50;
        --panel-2: #34495e;
        --text: #ecf0f1;
        --muted: rgba(236, 240, 241, .45);
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 24px 16px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        background: radial-gradient(circle at 50% 0%, #2c3e50 0%, #1a1a1a 65%);
        color: var(--text);
        text-align: center;
        overflow-x: hidden;
    }

    /* ============ CALCULATOR ============ */
    .calculator {
        background: var(--panel);
        padding: 22px;
        border-radius: 18px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, .35);
        width: 350px;
        max-width: 100%;
        transition: transform .3s ease;
    }
    .calculator:hover { transform: translateY(-2px); }

    .display {
        width: 100%;
        padding: 18px 16px;
        font-size: 2em;
        font-weight: 700;
        background: var(--panel-2);
        border-radius: 12px;
        color: var(--text);
        min-height: 90px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        word-break: break-all;
        overflow-x: auto;
        text-align: right;
        font-variant-numeric: tabular-nums;
        transition: color .2s, font-size .3s, justify-content .3s;
    }

    /* Style for when lyrics are showing */
    .display.lyrics-mode {
        justify-content: center;
        text-align: center;
        font-size: 1.25em;
        line-height: 1.4;
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        padding: 20px 12px;
        scrollbar-width: none;
    }
    .display.lyrics-mode::-webkit-scrollbar {
        display: none;
    }

    /* Dynamic font sizes for long lyrics */
    .display.lyrics-mode .karaoke.small { font-size: 0.8em; }
    .display.lyrics-mode .karaoke.xsmall { font-size: 0.65em; }

    .display.error { color: #ff7675; }

    /* Karaoke fill effect */
    .karaoke {
        display: inline-block;
        --p: 0%;
        background-image: linear-gradient(
            90deg,
            var(--accent) 0%,
            #2ee6c4 var(--p),
            rgba(236, 240, 241, .25) var(--p),
            rgba(236, 240, 241, .25) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
    }
    .karaoke.swap { animation: lineIn .45s cubic-bezier(.22, 1, .36, 1); }
    @keyframes lineIn {
        from { opacity: 0; transform: translateY(10px) scale(.97); }
        to   { opacity: 1; transform: none; }
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 14px;
    }
    .buttons button {
        padding: 18px 0;
        font-family: inherit;
        font-size: 1.3em;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        color: #fff;
        background: var(--panel-2);
        box-shadow: 0 4px 10px rgba(0, 0, 0, .22);
        transition: background .22s, transform .12s, box-shadow .22s;
        -webkit-tap-highlight-color: transparent;
    }
    .buttons button:hover { background: #3e5771; transform: translateY(-2px); }
    .buttons button:active { transform: translateY(1px); box-shadow: 0 2px 5px rgba(0, 0, 0, .25); }

    .buttons button.op { background: #2f6f66; }
    .buttons button.op:hover { background: #37857a; }

    .buttons button.clear { background: #c0392b; }
    .buttons button.clear:hover { background: #e04b3a; }

    .buttons button.equals {
        background: linear-gradient(145deg, var(--accent), var(--accent-dark));
        font-weight: 700;
    }
    .buttons button.equals:hover { background: linear-gradient(145deg, #2ee6c4, var(--accent)); }
    .buttons button.wide { grid-column: span 2; }

    @media (max-width: 480px) {
        .calculator { padding: 18px; }
        .display { font-size: 1.7em; min-height: 80px; }
        .buttons button { font-size: 1.1em; padding: 16px 0; }
        .display.lyrics-mode { font-size: 1.15em; }
    }
</style>
</head>
<body>

<!-- Audio Source: Bulong by December Avenue -->
<audio id="song" preload="auto">
    <source src="https://archive.org/download/gloc-9-feat.-ebe-dancel-sirena-official-music-video/December%20Avenue%20-%20Bulong%20%28OFFICIAL%20MUSIC%20VIDEO%29.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<!-- Calculator -->
<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
        <button type="button" class="clear" data-action="clear">C</button>
        <button type="button" class="op" data-value="(">(</button>
        <button type="button" class="op" data-value=")">)</button>
        <button type="button" class="op" data-value="/">/</button>

        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>
        <button type="button" class="op" data-value="*">*</button>

        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>
        <button type="button" class="op" data-value="-">-</button>

        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" class="op" data-value="+">+</button>

        <button type="button" class="wide" data-value="0">0</button>
        <button type="button" data-value=".">.</button>
        <button type="button" class="equals" data-action="equals">=</button>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* =========================================================
       1. CONFIG & LYRICS
       ========================================================= */
    const CONFIG = {
        startAt: 37.64,       // playback jumps here when you press "="
        offset: 0,            // seconds; adjust live with the buttons
        maxLineDuration: 8    // how long a line takes to fully "fill"
    };

    // Times are absolute from the beginning of the audio file.
    const LYRICS = [
        // --- Verse 1 ---
        { time: 37.64, text: "Hindi masabi ang nararamdaman" },
        { time: 44.64, text: "Hindi makalapit" },
        { time: 48.24, text: "Sadyang nanginginig na lang" },
        { time: 52.16, text: "Mga kamay na sabik sa piling mo" },
        { time: 58.31, text: "Ang iyong matang walang mintis" },
        { time: 61.91, text: "Sa pagtigil ng aking mundo" },

        // --- Chorus 1 ---
        { time: 66.40, text: "Ako'y alipin ng pag-ibig mo" },
        { time: 73.18, text: "Handang ibigin ang isang tulad mo" },
        { time: 80.36, text: "Hangga't ang puso mo'y sa akin lang" },
        { time: 85.01, text: "Hindi ka na malilinlang" },
        { time: 88.63, text: "Ikaw ang ilaw sa dilim" },
        { time: 91.99, text: "At ang liwanag ng mga bituin" },

        // --- Verse 2 ---
        { time: 108.80, text: "Hindi mapakali" },
        { time: 112.23, text: "Hanggang tingin na lang" },
        { time: 115.33, text: "Bumubulong sa'yong tabi" },
        { time: 119.39, text: "Sadyang walang makapantay" },
        { time: 123.22, text: "Sa kagandahang inuukit mo sa isip ko" },

        // --- Chorus 2 ---
        { time: 130.44, text: "Ako'y alipin ng pag-ibig mo" },
        { time: 137.11, text: "Handang ibigin ang isang tulad mo" },
        { time: 144.36, text: "Hangga't ang puso mo'y sa akin lang" },
        { time: 149.01, text: "Hindi ka na malilinlang" },
        { time: 152.65, text: "Ikaw ang ilaw sa dilim" },
        { time: 155.99, text: "At ang liwanag ng mga bituin" },

        // --- Chorus 3 (final) ---
        { time: 186.87, text: "Ako'y alipin ng pag-ibig mo" },
        { time: 193.99, text: "Handang ibigin ang isang tulad mo" },
        { time: 200.98, text: "Hangga't ang puso mo'y sa akin lang" },
        { time: 205.43, text: "Hindi ka na malilinlang" },
        { time: 209.43, text: "Ikaw ang ilaw sa dilim" },
        { time: 212.78, text: "At ang liwanag ng mga bituin" },

        // --- Outro ---
        { time: 221.78, text: "Ng mga bituin" },
        { time: 228.91, text: "Ng mga bituin" },
        { time: 236.16, text: "Ng mga bituin" }
    ];

    /* =========================================================
       2. ELEMENT REFERENCES
       ========================================================= */
    const song    = document.getElementById('song');
    const display = document.getElementById('display');

    /* =========================================================
       3. LYRICS ENGINE
       ========================================================= */
    let rafId      = null;
    let lineIndex  = -2;
    let started    = false;
    let lastFill   = -1;

    const lineStart = i => LYRICS[i].time + CONFIG.offset;

    function findLineIndex(t) {
        let idx = -1;
        for (let i = 0; i < LYRICS.length; i++) {
            if (t >= lineStart(i)) idx = i;
            else break;
        }
        return idx;
    }

    function render() {
        const t = song.currentTime;
        const i = findLineIndex(t);

        // Only update the DOM when the lyric line actually changes
        if (i !== lineIndex) {
            lineIndex = i;

            if (i === -1) {
                display.innerHTML = '';
            } else {
                const text = LYRICS[i].text;
                const length = text.length;
                
                // Dynamically adjust font size based on text length
                let sizeClass = '';
                if (length > 32) sizeClass = 'xsmall';
                else if (length > 24) sizeClass = 'small';

                // Inject the lyric line with the appropriate size class
                display.innerHTML = `<span class="karaoke ${sizeClass}" id="karaokeSpan">${text}</span>`;
                
                const karaokeSpan = document.getElementById('karaokeSpan');
                if (karaokeSpan) {
                    karaokeSpan.classList.remove('swap');
                    void karaokeSpan.offsetWidth;
                    karaokeSpan.classList.add('swap');
                }
            }
            lastFill = -1;
        }

        // Update the karaoke fill progress smoothly
        if (i >= 0) {
            const start     = lineStart(i);
            const nextStart = (i + 1 < LYRICS.length) ? lineStart(i + 1) : Infinity;
            const end       = Math.min(nextStart, start + CONFIG.maxLineDuration);
            const span      = end - start;

            const p = span > 0
                ? Math.min(1, Math.max(0, (t - start) / span))
                : 1;

            const pct = Math.round(p * 1000) / 10;
            if (pct !== lastFill) {
                lastFill = pct;
                const karaokeSpan = document.getElementById('karaokeSpan');
                if (karaokeSpan) {
                    karaokeSpan.style.setProperty('--p', pct + '%');
                }
            }
        }
    }

    function loop() {
        render();
        rafId = requestAnimationFrame(loop);
    }

    function startLoop() {
        if (rafId === null) rafId = requestAnimationFrame(loop);
    }

    function stopLoop() {
        if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    /* =========================================================
       4. PLAYBACK CONTROL
       ========================================================= */
    function startSong() {
        if (started) return;
        started = true;

        // Switch the display to lyric mode
        display.classList.add('lyrics-mode');

        const begin = () => {
            try {
                const max = isFinite(song.duration) ? Math.max(0, song.duration - 1) : CONFIG.startAt;
                song.currentTime = Math.min(CONFIG.startAt, max);
            } catch (_) { /* ignore */ }

            const p = song.play();
            if (p && typeof p.catch === 'function') {
                p.catch(err => {
                    console.warn('Playback was blocked:', err);
                    started = false;
                    display.classList.remove('lyrics-mode');
                });
            }
            startLoop();
            render();
        };

        if (song.readyState >= 1) {
            begin();
        } else {
            display.innerHTML = 'Loading...';
            song.addEventListener('loadedmetadata', begin, { once: true });
        }
    }

    song.addEventListener('ended', () => {
        stopLoop();
        started = false;
        lineIndex = -2;
        lastFill = -1;
        display.classList.remove('lyrics-mode');
        display.textContent = '0';
    });

    song.addEventListener('error', () => {
        display.innerHTML = '⚠ Audio Error';
        display.classList.remove('lyrics-mode');
        started = false;
    });

    /* =========================================================
       5. SYNC / SEEK HELPERS (Keyboard Shortcuts)
       ========================================================= */
    function seek(delta) {
        if (!isFinite(song.duration)) return;
        song.currentTime = Math.min(
            Math.max(0, song.currentTime + delta),
            song.duration - 0.1
        );
        render();
    }

    document.addEventListener('keydown', e => {
        if (!started) return;
        if (e.code === 'Space') {
            e.preventDefault();
            song.paused ? song.play() : song.pause();
        } else if (e.code === 'ArrowLeft') {
            e.preventDefault(); seek(-5);
        } else if (e.code === 'ArrowRight') {
            e.preventDefault(); seek(5);
        }
    });

    /* =========================================================
       6. CALCULATOR
       ========================================================= */
    let expression   = '';
    let justEvaluated = false;
    const OPS = '+-*/';

    function paint() {
        display.textContent = expression === '' ? '0' : expression;
    }

    function stopLyrics() {
        if (started) {
            song.pause();
            stopLoop();
            started = false;
            display.classList.remove('lyrics-mode');
            expression = '';
            justEvaluated = false;
            lineIndex = -2;
            lastFill = -1;
        }
    }

    function appendToDisplay(value) {
        stopLyrics(); // Stop lyrics if user starts typing

        if (justEvaluated) {
            if (!OPS.includes(value)) expression = '';
            justEvaluated = false;
        }

        const last = expression.slice(-1);

        if (OPS.includes(value) && OPS.includes(last)) {
            const negativeAfterMulDiv = value === '-' && (last === '*' || last === '/');
            if (!negativeAfterMulDiv) {
                expression = expression.slice(0, -1) + value;
                paint();
                return;
            }
        }

        if (value === '.') {
            const tail = expression.split(/[+\-*/()]/).pop();
            if (tail.includes('.')) return;
            if (tail === '') expression += '0';
        }

        expression += value;
        paint();
    }

    function clearDisplay() {
        stopLyrics();
        expression = '';
        justEvaluated = false;
        display.classList.remove('error');
        paint();
    }

    function showError() {
        expression = '';
        justEvaluated = true;
        display.textContent = 'Error';
        display.classList.add('error');
        setTimeout(() => display.classList.remove('error'), 800);
    }

    function calculate() {
        const expr = expression.trim();
        if (!expr) return;

        if (!/^[0-9+\-*/().\s]+$/.test(expr)) { showError(); return; }

        try {
            const raw = Function('"use strict";return (' + expr + ')')();
            if (typeof raw !== 'number' || !isFinite(raw)) { showError(); return; }

            const clean = Number.isInteger(raw) ? raw : Number(raw.toPrecision(12));

            expression    = String(clean);
            justEvaluated = true;
            display.textContent = expression;

            // Trigger the song and lyrics
            startSong();
        } catch (_) {
            showError();
        }
    }

    document.querySelectorAll('.buttons button').forEach(btn => {
        btn.addEventListener('click', () => {
            const { value, action } = btn.dataset;
            if (value !== undefined)      appendToDisplay(value);
            else if (action === 'clear')  clearDisplay();
            else if (action === 'equals') calculate();
        });
    });

    paint();
})();
</script>

</body>
</html>
